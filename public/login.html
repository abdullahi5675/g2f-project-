<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — G2F</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="page" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
    <div class="card" style="width:100%; max-width:400px; padding:40px;">
      <h2 style="text-align:center; margin-bottom:20px;">G2F Login</h2>
      <div id="errorMsg" class="alert alert-error hidden"></div>
      <div class="form-group mb-4">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
      </div>
      <div class="form-group mb-8" style="position:relative;">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" style="padding-right:40px;">
        <span style="position:absolute; right:12px; top:38px; cursor:pointer;" onclick="togglePassword('password', this)">👁️</span>
      </div>
      <button class="btn btn-primary btn-full" onclick="login()">Login</button>
      <p style="text-align:center; margin-top:16px;">Don't have an account? <a href="signup.html">Register here</a></p>
    </div>
  </div>
  <script>
    function togglePassword(id, el) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        el.textContent = '🙈';
      } else {
        input.type = 'password';
        el.textContent = '👁️';
      }
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('button');
      
      if(!username || !password) return alert('Fill all fields');
      
      btn.innerText = 'Loading...';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if(res.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('auth_token', data.token);
          if(data.user.role === 'officer') window.location.href = '/register';
          else if(data.user.role === 'agent') window.location.href = '/agent';
          else if(data.user.role === 'supervisor') window.location.href = '/dashboard';
        } else {
          document.getElementById('errorMsg').innerText = data.error;
          document.getElementById('errorMsg').classList.remove('hidden');
        }
      } catch (err) {
        alert('Error logging in');
      } finally {
        btn.innerText = 'Login';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
